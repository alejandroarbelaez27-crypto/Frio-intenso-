<style>
  /* ===== Colores de la marca (claro / oscuro) ===== */
  :root{
    --bg:#eef8fc; --surface:#ffffff; --surface2:#f4fafd; --ink:#0b2b3c; --muted:#557282;
    --line:#d6e9f1; --primary:#0b80c2; --primary-ink:#ffffff; --accent:#2fd0dc;
    --danger:#cc3b3b; --grid:#e4f0f5; --shadow:0 4px 16px rgba(11,60,90,.08);
    --gran:#0b80c2; --frap:#c4620a; --on-c:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#07141c; --surface:#0e212c; --surface2:#132a37; --ink:#e4f4fb; --muted:#8fb1c2;
      --line:#1e3b4a; --primary:#3db4ee; --primary-ink:#03202e; --accent:#40dbe6;
      --danger:#ff7070; --grid:#183443; --shadow:none;
      --gran:#3db4ee; --frap:#f5a54a; --on-c:#04202d;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Nunito,system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  body.con-pedido{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
  button{font:inherit;cursor:pointer}

  /* ===== Encabezado ===== */
  header.top{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:linear-gradient(120deg,#0a74b3 0%,#1aa6d8 55%,#36d3dd 100%); color:#fff;
  }
  header.top img{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);flex:none}
  .brand h1{font-family:Pacifico,cursive;font-weight:400;font-size:23px;margin:0;line-height:1.15}
  .brand small{font-size:12px;font-weight:700;opacity:.92;letter-spacing:.2px}
  .hoy-pill{margin-left:auto;text-align:right;font-size:11px;font-weight:700;opacity:.95;line-height:1.25}
  .hoy-pill b{display:block;font-size:15px}

  main{max-width:760px;margin:0 auto;padding:14px 16px}
  .view{display:none} .view.active{display:block}
  h2{font-size:19px;margin:4px 0 12px;font-weight:800}

  /* ===== Selector Granizados / Frappés ===== */
  .seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;border:1px solid var(--line);flex:none}
  .seg button{border:none;background:none;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:800;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg.big{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;margin-bottom:12px;background:var(--surface)}
  .seg.big.three{grid-template-columns:repeat(3,1fr)}
  .seg.big button{padding:11px 6px;font-size:15px;border-radius:11px}
  .seg.big button.on{background:var(--c,var(--primary));color:var(--on-c);box-shadow:none}

  /* ===== Selector de categorías ===== */
  .lchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
  .lchips::-webkit-scrollbar{display:none}
  .lchip{flex:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 15px;border-radius:14px;font-weight:800;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .lchip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
  .lchip.on{background:var(--c);border-color:var(--c);color:var(--tc)}
  .lchip.on i{background:var(--tc)}
  .lchip.off{opacity:.55}
  .lchip.add{border-style:dashed;color:var(--muted)}
  .pres-row{display:grid;grid-template-columns:1fr 86px 80px 40px;gap:6px;margin-bottom:8px;align-items:center}
  .pres-row .in{padding:11px 9px}
  .pres-h{margin-bottom:2px;font-size:12px;font-weight:800;color:var(--muted)}
  .tam-btn .o.txt{font-size:20px;line-height:1.15;word-break:break-word}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-weight:700;font-size:14px}
  .opt input{margin-top:3px;width:18px;height:18px;flex:none}
  .opt small{display:block;color:var(--muted);font-weight:600;font-size:12px}

  /* ===== Chips ===== */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
  .chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

  /* ===== Caja ===== */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .prod{
    position:relative;border:none;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);
    padding:14px 12px 12px;text-align:left;color:var(--ink);min-height:100px;
    border-top:6px solid var(--c);transition:transform .08s;
  }
  .prod:active{transform:scale(.96)}
  .prod .cat{font-size:12px;color:var(--muted);font-weight:700}
  .prod .n{font-weight:800;font-size:17px;line-height:1.2;margin-top:2px;padding-right:26px}
  .prod .p{margin-top:8px;font-weight:800;color:var(--primary);font-size:14px}
  .prod .q{position:absolute;top:8px;right:8px;background:var(--primary);color:var(--primary-ink);min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:14px;padding:0 7px}

  .orderbar{
    position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:15;
    padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);
    display:none;align-items:center;gap:10px;box-shadow:0 -4px 16px rgba(11,60,90,.08);
  }
  .orderbar.show{display:flex}
  .orderbar .info{flex:1;min-width:0}
  .orderbar .info small{color:var(--muted);font-weight:700;font-size:12px}
  .orderbar .info b{display:block;font-size:19px}

  /* Selector de tamaño */
  .tam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
  .tam-btn{position:relative;border:2px solid var(--line);background:var(--surface2);border-radius:16px;padding:16px 8px 14px;text-align:center;color:var(--ink)}
  .tam-btn:active{transform:scale(.96);border-color:var(--primary)}
  .tam-btn .o{font-size:30px;font-weight:800;line-height:1}
  .tam-btn .o small{font-size:14px;margin-left:2px}
  .tam-btn .nm{font-size:12px;color:var(--muted);font-weight:700;min-height:16px;margin-top:4px}
  .tam-btn .pr{margin-top:4px;font-weight:800;color:var(--primary);font-size:15px}
  .tam-btn .q{position:absolute;top:6px;right:6px;background:var(--primary);color:var(--primary-ink);min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;padding:0 6px}

  .btn{border:none;border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px;background:var(--primary);color:var(--primary-ink)}
  .btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn.danger-fill{background:var(--danger);color:#fff}
  .btn.block{width:100%}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .icon-btn{border:none;background:var(--surface2);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:20px;font-weight:800;display:grid;place-items:center;flex:none}
  .icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn.del{color:var(--danger)}

  /* ===== Tarjetas / estadísticas ===== */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  @media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:21px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .hl{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:5px solid var(--c)}
  .hl .l{font-size:12px;color:var(--muted);font-weight:700}
  .hl .v{font-size:17px;font-weight:800;margin:2px 0}
  .hl .s{font-size:12px;color:var(--muted);font-weight:600}
  .card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
  .card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .card-h > div:first-child{flex:1;min-width:0}
  .card h3{margin:0;font-size:15px;font-weight:800}
  .card .sub{color:var(--muted);font-size:12px;margin:2px 0 10px;font-weight:600}
  .chartbox{position:relative;height:240px}
  .bar-row{display:grid;grid-template-columns:112px 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:14px;font-weight:700}
  .bar-row small{display:block;font-size:11px;color:var(--muted);font-weight:700}
  .bar-track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
  .bar-fill{height:100%;border-radius:5px;background:var(--c,var(--primary))}
  .bar-row > span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
  .empty{text-align:center;padding:30px 16px;color:var(--muted);font-weight:600}
  .empty img{width:90px;opacity:.9;margin-bottom:8px}
  .line-title{display:flex;align-items:center;gap:8px;margin:22px 2px 10px;font-size:17px;font-weight:800}
  .line-title::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c)}

  /* ===== Historial ===== */
  .day-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;font-weight:800}
  .day-h span{color:var(--muted);font-size:13px}
  .sale{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;display:flex;gap:10px;align-items:center}
  .sale .t{font-weight:800;font-size:13px;color:var(--muted);width:48px;flex:none}
  .sale .d{flex:1;min-width:0;font-size:14px;font-weight:600}
  .sale .d small{display:block;color:var(--muted);font-size:12px}
  .sale .m{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
  .del-x{border:none;background:none;color:var(--muted);font-size:18px;padding:4px 6px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}

  /* ===== Productos ===== */
  .prow{background:var(--surface);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:var(--shadow);margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
  .prow .d{flex:1;min-width:0;font-weight:800}
  .prow .d small{display:block;color:var(--muted);font-weight:600;font-size:12px}
  .prow.off{opacity:.55}
  .ozb{width:54px;height:50px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:grid;place-content:center;font-weight:800;font-size:19px;line-height:1;flex:none;text-align:center}
  .ozb small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
  .sec-h b{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .section-t{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  /* ===== Hoja inferior (modal) ===== */
  .sheet-bg{position:fixed;inset:0;background:rgba(3,20,30,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.show{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 4px;font-size:18px;font-weight:800}
  .sheet .sub{color:var(--muted);font-size:13px;font-weight:700;margin:0 0 14px}
  .line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .line .nm{flex:1;font-weight:700;min-width:0}
  .line .nm small{display:block;color:var(--muted);font-weight:600;font-size:12px}
  .line .qty{display:flex;align-items:center;gap:8px;font-weight:800}
  .line .qty b{min-width:20px;text-align:center}
  .line .st{width:78px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .total-row{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0}
  label.f{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 6px}
  input.in,select.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:16px;font-weight:700}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c)}
  .sw.on{border-color:var(--ink)}
  .row2{display:flex;gap:10px;margin-top:18px}
  .row2 .btn{flex:1}
  .check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700}
  .check input{width:20px;height:20px}
  #payChips{flex-wrap:wrap;overflow:visible}

  /* Confirmación propia (los confirm() del navegador se bloquean en algunas vistas) */
  .dlg-bg{position:fixed;inset:0;background:rgba(3,20,30,.6);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
  .dlg-bg.show{display:flex}
  .dlg{background:var(--surface);border-radius:20px;padding:20px;max-width:360px;width:100%;animation:up .15s ease-out}
  .dlg p{margin:0;font-size:16px;font-weight:700;line-height:1.4}

  /* ===== Navegación inferior ===== */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{background:none;border:none;color:var(--muted);padding:8px 0 9px;font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}

  /* ===== Cierre de caja ===== */
  .warn{background:color-mix(in srgb,var(--frap) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--frap) 45%,transparent);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700;font-size:14px}
  .warn .btn{margin-top:10px}
  .big-total{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 4px}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
  .mini div{background:var(--surface2);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:700;color:var(--muted)}
  .mini b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv span:last-child{font-variant-numeric:tabular-nums}
  .kv.tot{font-size:16px;font-weight:800}
  .diff{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
  .diff.ok{background:color-mix(in srgb,#3aa655 18%,transparent);color:#2b8a46}
  .diff.mas{background:color-mix(in srgb,var(--gran) 18%,transparent);color:var(--gran)}
  .diff.menos{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
  .diff.na{background:var(--surface2);color:var(--muted)}
  @media (prefers-color-scheme: dark){ .diff.ok{color:#6fd68a} }
  .diff-box{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800}
  .cierre-row{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%;border:none;text-align:left;color:var(--ink)}
  .cierre-row .d{flex:1;min-width:0;font-weight:800}
  .cierre-row .d small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
  .cierre-row .m{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .cierre-row .m .diff{margin-top:4px}
  .lock{color:var(--muted);padding:4px 6px;display:grid;place-items:center;border:none;background:none}
  .lock svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .day-h small{display:block;font-size:12px;color:var(--muted);font-weight:700}
  nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  nav.tabs button.on{color:var(--primary)}

  .login{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(150deg,#0a74b3 0%,#1aa6d8 55%,#36d3dd 100%)}
  .login.show{display:flex}
  .login-box{background:var(--surface);border-radius:24px;padding:24px 20px;width:100%;max-width:380px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .login-box img{width:110px;height:110px;border-radius:50%}
  .login-box h1{font-family:Pacifico,cursive;font-weight:400;font-size:28px;margin:6px 0 0;color:var(--primary)}
  .login-box form{text-align:left}
  .login-box .err{color:var(--danger);font-weight:700;font-size:14px;margin:12px 0 0;min-height:1em}
  /* ===== Finanzas ===== */
  .per{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .per b{flex:1;text-align:center;font-size:18px;font-weight:800;text-transform:capitalize}
  .er{margin-top:6px}
  .er-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-weight:700;font-size:14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .er-row.sub{padding:3px 0 3px 14px;font-weight:600;color:var(--muted);font-size:13px;border-bottom:none}
  .er-row.tot{font-weight:800;font-size:16px;border-top:2px solid var(--ink);border-bottom:none;padding-top:10px}
  .er-row .pct{color:var(--muted);font-size:12px;font-weight:700;margin-left:6px}
  .neg{color:var(--danger)} .pos{color:#2b8a46}
  @media (prefers-color-scheme: dark){ .pos{color:#6fd68a} }
  .ft-wrap{overflow-x:auto;margin:4px -4px 0;padding:0 4px}
  .ft{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  .ft td:not(:first-child),.ft th:not(:first-child){white-space:nowrap}
  .ft th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:800;text-align:right;padding:6px 3px;border-bottom:1px solid var(--line)}
  .ft th:first-child,.ft td:first-child{text-align:left}
  .ft td{padding:8px 3px;text-align:right;font-weight:700;border-bottom:1px solid var(--line)}
  .ft tr.tot td{font-weight:800;border-bottom:none;border-top:2px solid var(--ink)}
  .gasto{background:var(--surface);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);margin-bottom:8px;display:flex;gap:10px;align-items:center}
  .gasto .f{width:44px;flex:none;font-size:12px;font-weight:800;color:var(--muted);text-align:center;line-height:1.15}
  .gasto .f b{display:block;font-size:18px;color:var(--ink)}
  .gasto .d{flex:1;min-width:0;font-weight:700;font-size:14px}
  .gasto .d small{display:block;color:var(--muted);font-weight:600;font-size:12px}
  .gasto .m{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chips.wrap{flex-wrap:wrap;overflow:visible}
  .monto-in{font-size:28px !important;font-weight:800 !important;text-align:center}
  .solo-print{display:none}
  @media print{
    :root{--bg:#fff;--surface:#fff;--surface2:#fff;--ink:#000;--muted:#444;--line:#bbb;--shadow:none}
    body{background:#fff;padding:0}
    header.top,nav.tabs,.orderbar,#netBanner,#finTop,.no-print,.toast,.sheet-bg,.dlg-bg,.login{display:none !important}
    .view{display:none !important} #v-fin{display:block !important}
    #finBody > :not(.imprimible){display:none !important}
    .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}
    .solo-print{display:block}
    main{max-width:none;padding:0}
  }
  .toast.largo{white-space:normal;width:calc(100% - 32px);text-align:center;border-radius:16px}
  .toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

const SUPABASE_URL = 'https://cahebvlgqgasavbulyli.supabase.co';   // ej: 'https://abcdefgh.supabase.co'

const sb = NUBE && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* ================= CAPA DE DATOS =================

const Almacen = {
  _mem: {},
  get(k, def){
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (this._mem[k] ?? def); }

  lineas: Almacen.get('fi_lineas', null),

});

  async cargar(){ return leerLocal(); },

const trozos = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
async function leerTabla(tabla, orden){   // Supabase entrega máximo 1000 filas por consulta
  let todo = [], desde = 0;
  for (;;){
    const { data, error } = await sb.from(tabla).select('*').order(orden, { ascending: true }).range(desde, desde + 999);
    if (error) throw error;
    todo = todo.concat(data);
    if (data.length < 1000) return todo;
    desde += 1000;
  }
}

    const tamanos = {};

// Selector de categoría reutilizable (fila de botones que se desliza)
function segLineas(id, actual, opts = {}){
  const lista = opts.todas ? lineasOrden() : lineasActivas();
  let html = opts.conTodos ? `<button class="lchip ${actual === 'todos' ? 'on' : ''}" data-l="todos" style="--c:var(--primary);--tc:var(--primary-ink)"><i></i>Todos</button>` : '';
  html += lista.map(l => `<button class="lchip ${l.id === actual ? 'on' : ''} ${l.activo === false ? 'off' : ''}" data-l="${l.id}" style="--c:${l.color};--tc:${textoSobre(l.color)}"><i></i>${esc(l.nombre)}</button>`).join('');
  if (opts.conNueva) html += `<button class="lchip add" data-l="__nueva">+ Categoría</button>`;
  const el = $(id); el.innerHTML = html;
  const on = el.querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// Encabezado: muestra la caja abierta (ventas sin cerrar) o el total de hoy si ya se cerró
function renderHoy(){
  const hoy = keyDia(new Date());
  const pend = S.ventas.filter(v => !v.cierreId);
  const cerradaHoy = S.cierres.some(c => c.dia === hoy);
  const pill = $('.hoy-pill');
  if (pend.length){
    pill.firstChild.textContent = 'Caja abierta';
    $('#hoyTotal').textContent = fmt(pend.reduce((a, v) => a + v.total, 0));
  } else {
    pill.firstChild.textContent = cerradaHoy ? 'Caja cerrada ✓' : 'Hoy';
    $('#hoyTotal').textContent = fmt(S.ventas.filter(v => keyDia(new Date(v.fecha)) === hoy).reduce((a, v) => a + v.total, 0));
  }
}

function renderCaja(){

  $('#prodGrid').innerHTML = lista.length ? lista.map(p => {
    const vs = variantesDe(p);
    const precioTxt = !vs.length ? (esPorTamano(p.linea) ? 'Sin tamaños' : 'Sin precio')
      : vs.length === 1 ? fmt(vs[0].precio) + (esPorTamano(p.linea) ? ' · ' + vs[0].etiqueta : '')

function agregar(pid, vid){

function elegirVariante(pid){
  const p = S.productos.find(x => x.id === pid); if (!p) return;
  const vs = variantesDe(p), porTam = esPorTamano(p.linea);
  if (!vs.length) return toast(porTam ? 'Agrega tamaños de ' + nombreLinea(p.linea).toLowerCase() + ' en Productos' : 'Ponle precio a ' + p.nombre + ' en Productos');

  openSheet(`
    <h3>${esc(p.nombre)}</h3>
    <p class="sub">${esc(unoDe(p.linea))} · elige ${porTam ? 'el tamaño' : 'la presentación'}</p>
    <div class="tam-grid">${vs.map(v => {
      const q = S.pedido[pid + '|' + v.id] || 0;
      return `<button class="tam-btn" data-t="${v.id}">

function pedidoItems(){
  return Object.entries(S.pedido).filter(([, q]) => q > 0).map(([k, q]) => {

  openSheet(`

  `);
  $('#sheet').onclick = async e => {
    const q = e.target.closest('[data-q]');

    const m = e.target.closest('[data-m]');

async function registrarVenta(){
  const items = pedidoItems().map(({ key, ...it }) => it); if (!items.length) return;
  const venta = { id: uid(), fecha: new Date().toISOString(), metodo: S.metodo, items, total: items.reduce((a, it) => a + it.precio * it.cantidad, 0) };
  S.ventas.push(venta);
  const enNube = await guardarVenta(venta);
  S.pedido = {};
  S.metodo = 'Efectivo';   // cada venta nueva arranca en efectivo

const RANGOS = [['hoy','Hoy'],['7','7 días'],['30','30 días'],['mes','Este mes'],['todo','Todo']];
function inicioRango(r){
  const d = new Date(); d.setHours(0,0,0,0);
  if (r === 'hoy') return d;
  if (r === '7'){ d.setDate(d.getDate() - 6); return d; }
  if (r === '30'){ d.setDate(d.getDate() - 29); return d; }
  if (r === 'mes'){ d.setDate(1); return d; }
  return null;
}

});

function calcular(){
  const ini = inicioRango(S.rango);
  const filtro = S.lineaStats;
  const incluye = l => filtro === 'todos' || l === filtro;
  const vRango = S.ventas.filter(v => !ini || new Date(v.fecha) >= ini);
  const porLinea = {}, prods = {}, vars = {};
  const asegurar = l => { if (!porLinea[l]){ porLinea[l] = { u: 0, i: 0 }; prods[l] = new Map(); vars[l] = new Map(); } };
  // Todos los productos y tamaños activos aparecen, aunque tengan 0 ventas
  S.productos.filter(p => p.activo && incluye(p.linea)).forEach(p => {
    asegurar(p.linea);
    prods[p.linea].set(p.id, { nombre: p.nombre, u: 0, i: 0, g: 0 });
    variantesDe(p).forEach(v => { if (!vars[p.linea].has(v.etiqueta)) vars[p.linea].set(v.etiqueta, { label: v.etiqueta, nombre: v.sub, oz: v.oz ?? 999, u: 0, i: 0 }); });
  });
  const porHora = new Array(24).fill(0), porDow = new Array(7).fill(0), porDia = new Map(), pagos = {};
  let ingresos = 0, unidades = 0, pedidos = 0;

  vRango.forEach(v => {
    const its = v.items.filter(it => incluye(it.linea)); if (!its.length) return;
    const f = new Date(v.fecha), k = keyDia(f);
    pedidos++;
    its.forEach(it => {
      const sub = it.precio * it.cantidad, l = it.linea;
      asegurar(l);
      ingresos += sub; unidades += it.cantidad;
      porLinea[l].u += it.cantidad; porLinea[l].i += sub;
      porHora[f.getHours()] += it.cantidad;
      porDow[f.getDay()] += sub;
      porDia.set(k, (porDia.get(k) || 0) + sub);
      pagos[v.metodo] = (pagos[v.metodo] || 0) + sub;
      if (!prods[l].has(it.productoId)){ const a = S.productos.find(p => p.id === it.productoId); prods[l].set(it.productoId, { nombre: a ? a.nombre : it.nombre, u: 0, i: 0, g: 0 }); }
      const r = prods[l].get(it.productoId), cu = costoItem(it); r.u += it.cantidad; r.i += sub;
      if (cu == null) r.sinCosto = true; else r.g += (it.precio - cu) * it.cantidad;
      const vk = varTxt(it) || 'Sin tamaño';
      if (!vars[l].has(vk)) vars[l].set(vk, { label: vk, nombre: '', oz: it.oz ?? 999, u: 0, i: 0 });
      const t = vars[l].get(vk); t.u += it.cantidad; t.i += sub;
    });
  });

  // Serie diaria continua (días sin ventas en 0)
  const dias = [];
  const fechas = vRango.map(v => +new Date(v.fecha));
  const desde = ini ? new Date(ini) : new Date(fechas.length ? Math.min(...fechas) : Date.now());
  desde.setHours(0,0,0,0);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  for (let d = new Date(desde); d <= hoy; d.setDate(d.getDate() + 1)) dias.push({ d: new Date(d), v: porDia.get(keyDia(d)) || 0 });
  const cuentaDow = new Array(7).fill(0); dias.forEach(x => cuentaDow[x.d.getDay()]++);
  const orden = (a, b) => b[S.rankBy] - a[S.rankBy] || b.i - a.i || b.u - a.u;
  const ranking = {}, variantes = {};
  Object.keys(porLinea).forEach(l => {
    ranking[l] = [...prods[l].values()].sort(orden);
    variantes[l] = [...vars[l].values()].sort(esPorTamano(l) ? (a, b) => a.oz - b.oz : (a, b) => b.u - a.u);
  });
  // Categorías a mostrar, en su orden; también las borradas que tengan ventas en el periodo
  const ids = [...lineaIds(), ...Object.keys(porLinea).filter(l => !LINEAS[l])].filter(l => porLinea[l] && (porLinea[l].u > 0 || LINEAS[l]?.activo !== false));
  return { filtro, pedidos, ingresos, unidades, porLinea, ranking, variantes, porHora, porDow, cuentaDow, dias, pagos, ids };
}

      <div class="card">

        ${filasBarras(vs.map(t => ({ titulo: esc(t.label), sub: t.nombre ? esc(t.nombre) : '', v: t.u,

      </div>`;
    }
  });

  html += D.filtro === 'todos' ? `<div class="line-title" style="--c:var(--primary)">General</div>` : '';
  html += `${mostrarDias ? `<div class="card">
      <h3>Ingresos por día</h3><p class="sub">Toca la gráfica para ver el valor de cada día</p>
      <div class="chartbox"><canvas id="cDias"></canvas></div>
    </div>` : ''}
    <div class="card">
      <h3>Horas pico</h3><p class="sub">Unidades vendidas por hora del día</p>

    </div>
    ${mostrarDias ? `<div class="card">
      <h3>Mejor día de la semana</h3><p class="sub">Ingreso promedio por día</p>
      <div class="chartbox" style="height:210px"><canvas id="cDow"></canvas></div>
    </div>` : ''}
    <div class="card">
      <h3>Métodos de pago</h3><p class="sub">Participación sobre los ingresos</p>
      ${filasBarras(Object.entries(D.pagos).sort((a, b) => b[1] - a[1]).map(([m, v]) => ({ titulo: esc(m), v, der: Math.round(v / totPagos * 100) + '%' })), totPagos, 'var(--primary)')}

  $('#statsBody').innerHTML = html;
  dibujarGraficas(D, lineas, mostrarDias);

/* ---------- Gráficas (Chart.js) ---------- */
function opcionesBase(){
  const muted = css('--muted'), grid = css('--grid'), ink = css('--ink'), surf = css('--surface');
  return {
    responsive: true, maintainAspectRatio: false, animation: { duration: 350 },
    plugins: {
      legend: { display: false },
      tooltip: { backgroundColor: ink, titleColor: surf, bodyColor: surf, padding: 10, cornerRadius: 10, displayColors: false,
        titleFont: { weight: '800' }, bodyFont: { weight: '700' } }
    },
    scales: {
      x: { grid: { display: false }, border: { display: false }, ticks: { color: muted, font: { weight: '700', size: 11 } } },
      y: { beginAtZero: true, grid: { color: grid }, border: { display: false }, ticks: { color: muted, font: { weight: '600', size: 11 }, maxTicksLimit: 5 } }
    }
  };
}
// Escribe el valor al final de cada barra del ranking
const etiquetasBarras = {
  id: 'etiquetas',
  afterDatasetsDraw(chart){
    const { ctx } = chart, meta = chart.getDatasetMeta(0), ds = chart.data.datasets[0];
    ctx.save(); ctx.fillStyle = css('--ink'); ctx.font = '800 12px Nunito, system-ui, sans-serif'; ctx.textBaseline = 'middle';
    meta.data.forEach((bar, i) => { const v = ds.data[i]; ctx.fillText(S.rankBy === 'u' ? v.toLocaleString('es-CO') : fmtK(v), bar.x + 6, bar.y); });
    ctx.restore();
  }
};

function dibujarGraficas(D, lineas, mostrarDias){
  if (typeof Chart === 'undefined'){
    document.querySelectorAll('.chartbox').forEach(b => b.innerHTML = '<div class="empty">Las gráficas necesitan internet la primera vez que se abre la app.</div>');
    return;
  }
  Chart.defaults.font.family = 'Nunito, system-ui, sans-serif';
  const colorBase = D.filtro === 'todos' ? css('--primary') : colorLinea(D.filtro);

  // 1) Ranking de sabores por línea
  lineas.forEach(l => {
    const cv = document.getElementById('cRank-' + l); if (!cv) return;
    const rk = D.ranking[l];
    const datos = rk.map(r => r[S.rankBy]);
    const o = opcionesBase();
    o.indexAxis = 'y';
    o.layout = { padding: { right: 46 } };
    o.scales.x = { display: false, beginAtZero: true, suggestedMax: Math.max(...datos, 1) };
    o.scales.y = { grid: { display: false }, border: { display: false }, ticks: { color: css('--ink'), font: { weight: '800', size: 13 } } };
    o.plugins.tooltip.callbacks = { label: c => { const r = rk[c.dataIndex]; return [r.u + ' unidades', 'Ventas ' + fmt(r.i), 'Ganancia ' + (r.sinCosto ? 'sin costo' : fmt(r.g))]; } };
    charts['rank-' + l] = new Chart(cv, {
      type: 'bar',
      data: { labels: rk.map(r => r.nombre), datasets: [{ data: datos, backgroundColor: colorLinea(l), borderRadius: 4, borderSkipped: 'start', barThickness: 18 }] },
      options: o, plugins: [etiquetasBarras]
    });
  });

  // 2) Ingresos por día
  if (mostrarDias){
    const o = opcionesBase();
    o.interaction = { mode: 'index', intersect: false };
    o.scales.y.ticks.callback = v => fmtK(v);
    o.scales.x.ticks.maxTicksLimit = 7; o.scales.x.ticks.maxRotation = 0;
    o.plugins.tooltip.callbacks = {
      title: c => { const d = D.dias[c[0].dataIndex].d; return DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); },
      label: c => fmt(c.parsed.y)
    };
    const ctx = document.getElementById('cDias').getContext('2d');
    const c = colorBase;
    const fondo = ctx.createLinearGradient(0, 0, 0, 240); fondo.addColorStop(0, c + '40'); fondo.addColorStop(1, c + '00');
    charts.dias = new Chart(ctx, { type: 'line', data: { labels: D.dias.map(x => x.d.getDate() + '/' + (x.d.getMonth() + 1)),
      datasets: [{ data: D.dias.map(x => x.v), borderColor: c, backgroundColor: fondo, fill: true, borderWidth: 2, tension: .3, pointRadius: 0, pointHoverRadius: 5,
        pointHoverBackgroundColor: c, pointHoverBorderColor: css('--surface'), pointHoverBorderWidth: 2 }] }, options: o });
  }

  // 3) Horas pico
  const conVentas = D.porHora.map((v, h) => v ? h : -1).filter(h => h >= 0);
  const hMin = Math.min(...conVentas, 10), hMax = Math.max(...conVentas, 18);
  const horas = []; for (let h = hMin; h <= hMax; h++) horas.push(h);
  const maxH = Math.max(...D.porHora);
  const oH = opcionesBase();
  oH.plugins.tooltip.callbacks = { title: c => horas[c[0].dataIndex] + ':00 – ' + horas[c[0].dataIndex] + ':59', label: c => c.parsed.y + ' unidades' };
  charts.horas = new Chart(document.getElementById('cHoras'), {
    type: 'bar',
    data: { labels: horas.map(h => (h % 12 || 12) + (h < 12 ? 'am' : 'pm')),
      datasets: [{ data: horas.map(h => D.porHora[h]), backgroundColor: horas.map(h => D.porHora[h] === maxH ? colorBase : colorBase + '66'), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 26 }] },
    options: oH
  });

  // 4) Día de la semana (Lun → Dom), promedio por día
  if (mostrarDias){
    const orden = [1, 2, 3, 4, 5, 6, 0];
    const prom = orden.map(d => D.cuentaDow[d] ? D.porDow[d] / D.cuentaDow[d] : 0);
    const maxP = Math.max(...prom);
    const oW = opcionesBase();
    oW.scales.y.ticks.callback = v => fmtK(v);
    oW.plugins.tooltip.callbacks = { label: c => fmt(c.parsed.y) + ' en promedio' };
    charts.dow = new Chart(document.getElementById('cDow'), {
      type: 'bar',
      data: { labels: orden.map(d => DIAS[d]),
        datasets: [{ data: prom, backgroundColor: prom.map(v => v === maxP ? colorBase : colorBase + '66'), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 34 }] },
      options: oW
    });
  }
}

const textoItem = it => `${it.cantidad}× ${esPorTamano(it.linea) ? esc(unoDe(it.linea)) + ' ' : ''}${esc(it.nombre)} ${esc(varTxt(it))}`.trim();
function renderHist(){
  if (!S.ventas.length){ $('#histBody').innerHTML = '<div class="empty">Todavía no hay ventas registradas.</div>'; return; }
  const grupos = new Map();
  [...S.ventas].sort((a, b) => b.fecha.localeCompare(a.fecha)).forEach(v => {
    const k = keyDia(new Date(v.fecha)); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(v);
  });
  const hoyK = keyDia(new Date()); const ay = new Date(); ay.setDate(ay.getDate() - 1); const ayerK = keyDia(ay);
  let html = '', n = 0;
  for (const [k, vs] of grupos){
    if (n >= 30){ html += `<div class="empty">Se muestran los últimos 30 días con ventas. Exporta el CSV para ver todo.</div>`; break; }
    const d = new Date(vs[0].fecha);
    const titulo = k === hoyK ? 'Hoy' : k === ayerK ? 'Ayer' : d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'short' });
    const cs = S.cierres.filter(c => c.dia === k);
    const estado = cs.length ? 'Caja cerrada a las ' + cs.map(c => hora(c.cerradoEn)).join(' y ') : 'Caja abierta';
    html += `<div class="day-h"><div>${esc(titulo.charAt(0).toUpperCase() + titulo.slice(1))}<small>${estado}</small></div><span>${vs.length} ventas · ${fmt(vs.reduce((a, v) => a + v.total, 0))}</span></div>`;
    html += vs.map(v => `<div class="sale">
      <div class="t">${hora(v.fecha)}</div>
      <div class="d">${v.items.map(textoItem).join(', ')}<small>${esc(v.metodo)}</small></div>
      <div class="m">${fmt(v.total)}</div>
      ${v.cierreId ? `<button class="lock" data-lock="1" aria-label="Venta en un cierre">${ICON_LOCK}</button>`
                   : `<button class="del-x" data-del="${v.id}" aria-label="Eliminar venta">✕</button>`}
    </div>`).join('');
    n++;
  }
  $('#histBody').innerHTML = html;
}

function descargar(nombre, contenido, tipo){
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
}

async function borrarProducto(id){
  const p = S.productos.find(x => x.id === id); if (!p) return;
  if (!await confirmar(`¿Eliminar "${p.nombre}" de ${nombreLinea(p.linea).toLowerCase()}? Las ventas pasadas se conservan.`)) return;
  S.productos = S.productos.filter(x => x.id !== id);
  Object.keys(S.pedido).forEach(k => { if (k.startsWith(id + '|')) delete S.pedido[k]; });
  closeSheet(); render();
  if (await guardar(DB.deleteProducto(id))) toast('Producto eliminado');
}
async function borrarTamano(id){
  const l = S.lineaProd, t = (S.tamanos[l] || []).find(x => x.id === id); if (!t) return;
  if (!await confirmar(`¿Eliminar el vaso de ${t.oz} oz de ${nombreLinea(l).toLowerCase()}? Las ventas pasadas se conservan.`)) return;
  S.tamanos[l] = S.tamanos[l].filter(x => x.id !== id);
  Object.keys(S.pedido).forEach(k => { if (k.endsWith('|' + id)) delete S.pedido[k]; });

/* ===================================================================
   CIERRE DE CAJA
   Cada venta queda "abierta" hasta que se cierra la caja de ese día.
   El cierre guarda los totales, la hora exacta y el cuadre de efectivo,
   y bloquea esas ventas para que el cierre no cambie después.
   =================================================================== */
const chartsC = {};
const fechaDeDia = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDia = (k, corto) => {
  const s = fechaDeDia(k).toLocaleDateString('es-CO', corto ? { weekday: 'short', day: 'numeric', month: 'numeric' } : { weekday: 'long', day: 'numeric', month: 'short' });
  return s.charAt(0).toUpperCase() + s.slice(1);
};
const diffBadge = d => d === null || d === undefined ? '<span class="diff na">Sin contar</span>'
  : d === 0 ? '<span class="diff ok">Cuadró ✓</span>'
  : d > 0 ? `<span class="diff mas">Sobrante ${fmt(d)}</span>` : `<span class="diff menos">Faltante ${fmt(-d)}</span>`;

// Ordena ids de categoría según el orden configurado (las borradas van al final)
const ordenarLineas = ids => { const ord = lineaIds(); return [...ids].sort((a, b) => (ord.indexOf(a) + 1 || 99) - (ord.indexOf(b) + 1 || 99)); };
function resumenVentas(vs){
  const r = { total: 0, pedidos: vs.length, unidades: 0, porMetodo: {}, porLinea: {}, unidadesLinea: {}, primera: null, ultima: null };
  vs.forEach(v => {
    r.total += v.total;
    r.porMetodo[v.metodo] = (r.porMetodo[v.metodo] || 0) + v.total;
    v.items.forEach(it => { const l = it.linea || 'otros'; r.unidades += it.cantidad; r.porLinea[l] = (r.porLinea[l] || 0) + it.precio * it.cantidad; r.unidadesLinea[l] = (r.unidadesLinea[l] || 0) + it.cantidad; });
    if (!r.primera || v.fecha < r.primera) r.primera = v.fecha;
    if (!r.ultima || v.fecha > r.ultima) r.ultima = v.fecha;
  });
  return r;
}
// Gastos pagados con efectivo de la caja en un día, que todavía no están en ningún cierre
const gastosCajaDe = dia => S.gastos.filter(g => !g.cierreId && g.medio === 'Efectivo' && g.fecha === dia);
function crearCierre(dia, vs, r, form, cerradoEn, gastos = []){
  const efectivoVentas = r.porMetodo.Efectivo || 0;
  const gastosEfectivo = gastos.reduce((a, g) => a + g.monto, 0);
  const esperado = (form.base || 0) + efectivoVentas - gastosEfectivo;
  const contado = form.contado === null || form.contado === '' || isNaN(form.contado) ? null : Number(form.contado);
  const id = uid();
  vs.forEach(v => { v.cierreId = id; });
  gastos.forEach(g => { g.cierreId = id; });
  return { id, dia, gastosEfectivo, cerradoEn: cerradoEn || new Date().toISOString(), primera: r.primera, ultima: r.ultima,
    pedidos: r.pedidos, unidades: r.unidades, total: r.total, porMetodo: r.porMetodo, porLinea: r.porLinea, unidadesLinea: r.unidadesLinea,
    base: form.base || 0, efectivoVentas, efectivoEsperado: esperado, efectivoContado: contado,
    diferencia: contado === null ? null : contado - esperado, responsable: form.responsable || '', nota: form.nota || '' };
}
// Ventas sin cerrar, agrupadas por día. Se cierra primero el día más antiguo.
function pendientesPorDia(){
  const m = new Map();
  S.ventas.filter(v => !v.cierreId).forEach(v => { const k = keyDia(new Date(v.fecha)); if (!m.has(k)) m.set(k, []); m.get(k).push(v); });
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}
const ultimoCierre = () => [...S.cierres].sort((a, b) => b.cerradoEn.localeCompare(a.cerradoEn))[0];

function renderCierre(){
  const pend = pendientesPorDia(), hoyK = keyDia(new Date());
  let html = '';
  if (!pend.length){
    const ch = S.cierres.filter(c => c.dia === hoyK);
    html = `<div class="card"><div class="empty" style="padding:18px 8px">${ch.length
      ? `✓ La caja de hoy se cerró a las <b>${hora(ch[ch.length - 1].cerradoEn)}</b>.<br>Si se vende algo más, se abre una caja nueva.`
      : 'No hay ventas pendientes por cerrar.<br>La caja se abre sola con la primera venta.'}</div></div>`;
  } else {
    const [dia, vs] = pend[0];
    const r = resumenVentas(vs);
    const u = ultimoCierre();
    const esHoy = dia === hoyK;
    const pasados = pend.filter(([d]) => d < hoyK).length;
    if (!esHoy) html += `<div class="warn">La caja del <b>${fmtDia(dia)}</b> quedó abierta. Ciérrala para cuadrar ese día.
      ${pasados > 1 ? `<br>Hay ${pasados} días anteriores sin cerrar.<br><button class="btn sm ghost" id="btnCerrarPasados">Cerrar los ${pasados} días sin contar efectivo</button>` : ''}</div>`;
    html += `
      <div class="card">
        <h3>${esHoy ? 'Caja de hoy' : 'Caja del ' + fmtDia(dia)} · abierta</h3>
        <p class="sub">Primera venta ${hora(r.primera)} · última ${hora(r.ultima)}</p>
        <div class="big-total">${fmt(r.total)}</div>
        <div class="mini"><div>Pedidos<b>${r.pedidos}</b></div><div>Unidades<b>${r.unidades}</b></div><div>Ticket prom.<b>${fmtK(Math.round(r.total / r.pedidos))}</b></div></div>
      </div>
      <div class="card">
        <h3>Por método de pago</h3>
        ${METODOS.concat(Object.keys(r.porMetodo).filter(m => !METODOS.includes(m))).filter(m => r.porMetodo[m]).map(m => `<div class="kv"><span>${esc(m)}</span><span>${fmt(r.porMetodo[m])}</span></div>`).join('')}
        <h3 style="margin-top:14px">Por categoría</h3>
        ${ordenarLineas(Object.keys(r.porLinea)).map(l => `<div class="kv"><span>${esc(nombreLinea(l))} · ${r.unidadesLinea[l]} u</span><span>${fmt(r.porLinea[l])}</span></div>`).join('')}
      </div>
      <div class="card" id="cuadre">
        <h3>Cuadre de efectivo</h3>
        <label class="f">Base (efectivo con el que se abrió)</label>
        <input class="in" id="cBase" type="number" inputmode="numeric" min="0" step="1000" value="${u ? u.base : ''}" placeholder="0">
        <div class="kv" style="margin-top:8px"><span>Ventas en efectivo</span><span>${fmt(r.porMetodo.Efectivo || 0)}</span></div>
        ${(() => { const gs = gastosCajaDe(dia), tot = gs.reduce((a, g) => a + g.monto, 0);
          return `<div class="kv"><span>Gastos pagados con la caja${gs.length ? `<small style="display:block;color:var(--muted);font-weight:600;font-size:12px">${gs.map(g => esc(g.descripcion || g.categoria) + ' ' + fmt(g.monto)).join(' · ')}</small>` : ''}</span><span>${tot ? '− ' + fmt(tot) : fmt(0)}</span></div>
          <button class="btn sm ghost" id="btnGastoCaja" style="margin:8px 0 2px">+ Gasto pagado con la caja</button>`; })()}
        <div class="kv tot"><span>Efectivo esperado</span><span id="cEsperado"></span></div>
        <label class="f">Efectivo contado</label>
        <input class="in" id="cContado" type="number" inputmode="numeric" min="0" step="500" placeholder="Cuenta billetes y monedas">
        <div class="diff-box"><span>Diferencia</span><span id="cDiff"></span></div>
        <label class="f">Quién cierra</label>
        <input class="in" id="cResp" value="${esc(u ? u.responsable : '')}" placeholder="Nombre" maxlength="30">
        <label class="f">Nota (opcional)</label>
        <input class="in" id="cNota" placeholder="Ej: se pagó hielo con la caja" maxlength="120">
        <label class="check"><input type="checkbox" id="cRespaldo" ${Almacen.get('fi_respaldo_auto', true) ? 'checked' : ''}> Descargar un respaldo al cerrar la caja</label>
        <button class="btn block" style="margin-top:16px" id="btnCerrar">Cerrar caja</button>
      </div>`;
    S._cierreActual = { dia, vs, r, gastos: gastosCajaDe(dia) };
  }
  $('#cierreActual').innerHTML = html;
  if (pend.length) actualizarCuadre();
  renderCierreStats();
  renderCierreLista();
}
function leerCuadre(){
  const { r } = S._cierreActual;
  const base = Math.max(0, Math.round(Number($('#cBase').value) || 0));
  const c = $('#cContado').value.trim();
  const contado = c === '' ? null : Math.round(Number(c));
  const gastosEf = (S._cierreActual.gastos || []).reduce((a, g) => a + g.monto, 0);
  return { base, contado, esperado: base + (r.porMetodo.Efectivo || 0) - gastosEf, responsable: $('#cResp').value.trim(), nota: $('#cNota').value.trim() };
}
function actualizarCuadre(){
  const q = leerCuadre();
  $('#cEsperado').textContent = fmt(q.esperado);
  $('#cDiff').innerHTML = diffBadge(q.contado === null ? null : q.contado - q.esperado);
}
$('#cierreActual').addEventListener('input', e => { if (e.target.id === 'cBase' || e.target.id === 'cContado') actualizarCuadre(); });
$('#cierreActual').addEventListener('change', e => { if (e.target.id === 'cRespaldo') Almacen.set('fi_respaldo_auto', e.target.checked); });
$('#cierreActual').addEventListener('click', async e => {
  if (e.target.id === 'btnCerrar'){
    if (NUBE && !navigator.onLine) return toast('Necesitas internet para cerrar la caja');
    const { dia, vs, r, gastos } = S._cierreActual, q = leerCuadre();
    const msg = `¿Cerrar la caja ${dia === keyDia(new Date()) ? 'de hoy' : 'del ' + fmtDia(dia)} con ${fmt(r.total)} en ventas?`
      + (q.contado === null ? ' No has contado el efectivo.' : '') + ' Las ventas quedarán bloqueadas.';
    if (!await confirmar(msg, 'Cerrar caja', false)) return;
    const c = crearCierre(dia, vs, r, q, null, gastos);
    S.cierres.push(c);
    Cola.sincronizar();
    if (!await guardar(DB.addCierre(c, vs.map(v => v.id), gastos.map(g => g.id)))) return;
    const respaldar = Almacen.get('fi_respaldo_auto', true);
    render(); window.scrollTo(0, 0);
    if (respaldar){ try { descargarRespaldo(); } catch(err){ console.error(err); } }
    toast('Caja cerrada a las ' + hora(c.cerradoEn) + (respaldar ? ' · respaldo descargado' : ''));
  }
  if (e.target.id === 'btnGastoCaja') return editarGasto(null, { medio: 'Efectivo', fecha: S._cierreActual.dia });
  if (e.target.id === 'btnCerrarPasados'){
    const hoyK = keyDia(new Date());
    const pasados = pendientesPorDia().filter(([d]) => d < hoyK);
    if (!await confirmar(`¿Cerrar ${pasados.length} días anteriores sin contar el efectivo?`, 'Cerrar días', false)) return;
    const base = ultimoCierre()?.base || 0;
    const nuevos = pasados.map(([d, vs]) => { const gs = gastosCajaDe(d);
      return [crearCierre(d, vs, resumenVentas(vs), { base, contado: null, responsable: '', nota: 'Cerrado sin conteo' }, null, gs), vs.map(v => v.id), gs.map(g => g.id)]; });
    nuevos.forEach(([c]) => S.cierres.push(c));
    Cola.sincronizar();
    for (const [c, ids, gids] of nuevos) if (!await guardar(DB.addCierre(c, ids, gids))) return;
    render(); toast(pasados.length + ' días cerrados');
  }
});

/* ---------- Gráficas de cierres ---------- */
function renderCierreStats(){
  Object.values(chartsC).forEach(c => c.destroy()); for (const k in chartsC) delete chartsC[k];
  let ini = null;
  if (S.rangoCierre !== 'todo'){ const d = new Date(); d.setDate(d.getDate() - (Number(S.rangoCierre) - 1)); ini = keyDia(d); }
  const porDia = new Map();
  S.cierres.filter(c => !ini || c.dia >= ini).forEach(c => {
    if (!porDia.has(c.dia)) porDia.set(c.dia, { dia: c.dia, total: 0, pedidos: 0, porMetodo: {}, porLinea: {}, dif: null, cerradoEn: c.cerradoEn });
    const x = porDia.get(c.dia);
    x.total += c.total; x.pedidos += c.pedidos;
    Object.entries(c.porMetodo).forEach(([m, v]) => x.porMetodo[m] = (x.porMetodo[m] || 0) + v);
    Object.entries(c.porLinea || {}).forEach(([l, v]) => x.porLinea[l] = (x.porLinea[l] || 0) + v);
    if (c.diferencia !== null && c.diferencia !== undefined) x.dif = (x.dif || 0) + c.diferencia;
    if (c.cerradoEn > x.cerradoEn) x.cerradoEn = c.cerradoEn;   // hora del último cierre del día
  });
  const dias = [...porDia.values()].sort((a, b) => a.dia.localeCompare(b.dia));
  const conDif = dias.filter(d => d.dif !== null);
  const total = dias.reduce((a, d) => a + d.total, 0), difTot = conDif.reduce((a, d) => a + d.dif, 0);

  let html = `<div class="line-title" style="--c:var(--primary)">Gráficas de cierres</div>
    <div class="chips">${[['7','7 días'],['30','30 días'],['todo','Todo']].map(([k, l]) => `<button class="chip ${k === S.rangoCierre ? 'on' : ''}" data-rc="${k}">${l}</button>`).join('')}</div>`;
  if (!dias.length){
    $('#cierreStats').innerHTML = html + '<div class="card"><div class="empty" style="padding:14px">Aún no hay cierres en este periodo.</div></div>';
    return;
  }
  html += `
    <div class="kpis">
      <div class="kpi"><div class="l">Total cerrado</div><div class="v">${fmt(total)}</div></div>
      <div class="kpi"><div class="l">Promedio por día</div><div class="v">${fmt(total / dias.length)}</div></div>
      <div class="kpi"><div class="l">Días cerrados</div><div class="v">${dias.length}</div></div>
      <div class="kpi"><div class="l">Diferencia acumulada</div><div class="v" style="font-size:16px;margin-top:6px">${conDif.length ? diffBadge(difTot) : diffBadge(null)}</div></div>
    </div>
    <div class="card"><h3>Ventas por cierre</h3><p class="sub">Total vendido en cada día cerrado. Toca una barra para ver el detalle.</p>
      <div class="chartbox"><canvas id="cCierres"></canvas></div></div>
    <div class="card"><h3>Hora de cierre</h3><p class="sub">A qué hora se cerró la caja cada día</p>
      <div class="chartbox" style="height:200px"><canvas id="cHoraCierre"></canvas></div></div>
    <div class="card"><h3>Cuadre de efectivo</h3><p class="sub">Sobrante (arriba de 0) o faltante (abajo de 0) al contar la caja</p>
      ${conDif.length ? '<div class="chartbox" style="height:200px"><canvas id="cDifs"></canvas></div>' : '<div class="empty" style="padding:12px">Ningún cierre de este periodo tiene efectivo contado.</div>'}</div>`;
  $('#cierreStats').innerHTML = html;
  if (typeof Chart === 'undefined') return;
  Chart.defaults.font.family = 'Nunito, system-ui, sans-serif';
  const labels = dias.map(d => { const f = fechaDeDia(d.dia); return f.getDate() + '/' + (f.getMonth() + 1); });
  const tituloDia = c => fmtDia(dias[c[0].dataIndex].dia, true);

  // 1) Total por día cerrado
  const o1 = opcionesBase();
  o1.scales.y.ticks.callback = v => fmtK(v);
  o1.scales.x.ticks.maxTicksLimit = 8; o1.scales.x.ticks.maxRotation = 0;
  o1.plugins.tooltip.callbacks = { title: tituloDia, label: c => {
    const d = dias[c.dataIndex];
    return ['Total: ' + fmt(d.total), d.pedidos + ' pedidos', ...Object.entries(d.porMetodo).map(([m, v]) => m + ': ' + fmt(v)),
      ...ordenarLineas(Object.keys(d.porLinea)).filter(l => d.porLinea[l]).map(l => nombreLinea(l) + ': ' + fmt(d.porLinea[l]))];
  } };
  chartsC.total = new Chart(document.getElementById('cCierres'), {
    type: 'bar', data: { labels, datasets: [{ data: dias.map(d => d.total), backgroundColor: css('--primary'), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 26 }] }, options: o1
  });

  // 2) Hora de cierre (hora decimal)
  const horaDec = iso => { const f = new Date(iso); return f.getHours() + f.getMinutes() / 60; };
  const hs = dias.map(d => horaDec(d.cerradoEn));
  const o2 = opcionesBase();
  o2.scales.y.beginAtZero = false;
  o2.scales.y.min = Math.max(0, Math.floor(Math.min(...hs)) - 1); o2.scales.y.max = Math.min(24, Math.ceil(Math.max(...hs)) + 1);
  o2.scales.y.ticks.stepSize = 1;
  o2.scales.y.ticks.callback = h => (h % 12 || 12) + (h < 12 || h === 24 ? 'am' : 'pm');
  o2.scales.x.ticks.maxTicksLimit = 8; o2.scales.x.ticks.maxRotation = 0;
  o2.plugins.tooltip.callbacks = { title: tituloDia, label: c => 'Cerrada a las ' + hora(dias[c.dataIndex].cerradoEn) };
  const cP = css('--primary');
  chartsC.hora = new Chart(document.getElementById('cHoraCierre'), {
    type: 'line', data: { labels, datasets: [{ data: hs, borderColor: cP + '55', borderWidth: 1.5, pointRadius: 4, pointHoverRadius: 6, pointBackgroundColor: cP, pointBorderColor: css('--surface'), pointBorderWidth: 1.5, tension: 0 }] }, options: o2
  });

  // 3) Diferencias de efectivo
  if (conDif.length){
    const o3 = opcionesBase();
    o3.scales.y.beginAtZero = true;
    o3.scales.y.ticks.callback = v => (v > 0 ? '+' : '') + fmtK(Math.abs(v)).replace('$', v < 0 ? '−$' : '$');
    o3.scales.x.ticks.maxTicksLimit = 8; o3.scales.x.ticks.maxRotation = 0;
    o3.plugins.tooltip.callbacks = { title: tituloDia, label: c => { const v = dias[c.dataIndex].dif; return v === null ? 'Sin contar' : v === 0 ? 'Cuadró' : v > 0 ? 'Sobrante ' + fmt(v) : 'Faltante ' + fmt(-v); } };
    const ok = '#3aa655', mas = css('--gran'), menos = css('--danger');
    chartsC.dif = new Chart(document.getElementById('cDifs'), {
      type: 'bar', data: { labels, datasets: [{ data: dias.map(d => d.dif), minBarLength: 3,
        backgroundColor: dias.map(d => d.dif === 0 ? ok : d.dif > 0 ? mas : menos), borderRadius: 4, borderSkipped: false, maxBarThickness: 26 }] }, options: o3
    });
  }
}

      ...METODOS.map(m => c.porMetodo[m] || 0), ...lineaIds().map(l => c.porLinea?.[l] || 0),

/* ===================================================================
   FINANZAS: gastos, estado de resultados y flujo de caja
   - Estado de resultados: ventas − costo de ventas − gastos operacionales = utilidad neta
   - Flujo de caja: lo que entró (ventas) y salió (gastos y compras) por medio de pago
   =================================================================== */
const chartsF = {};
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtN = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('es-CO');   // número sin "$", para tablas angostas
const pct = (n, base) => base ? Math.round(n / base * 100) + '%' : '—';
function periodoFin(){
  const r = S.finRef;
  if (S.finModo === 'anio') return { ini: new Date(r.getFullYear(), 0, 1), fin: new Date(r.getFullYear() + 1, 0, 1), titulo: String(r.getFullYear()), archivo: String(r.getFullYear()) };
  return { ini: new Date(r.getFullYear(), r.getMonth(), 1), fin: new Date(r.getFullYear(), r.getMonth() + 1, 1),
    titulo: MESES[r.getMonth()] + ' ' + r.getFullYear(), archivo: r.getFullYear() + '-' + String(r.getMonth() + 1).padStart(2, '0') };
}
function calcularFin(){
  const { ini, fin } = periodoFin();
  const kIni = keyDia(ini), kFin = keyDia(fin);
  const R = { ventas: 0, costo: 0, sinCostoU: 0, sinCostoV: 0, porLinea: {}, entradas: {}, salidas: {}, gastosOp: 0, compras: 0, porCatGasto: {}, gastos: [], buckets: [] };
  // Grupos para las gráficas: semanas del mes, o meses del año
  if (S.finModo === 'anio') for (let m = 0; m < 12; m++) R.buckets.push({ label: MESES[m].slice(0, 3), ent: 0, sal: 0, ventas: 0, costo: 0, gop: 0 });
  else { const n = new Date(ini.getFullYear(), ini.getMonth() + 1, 0).getDate();
    for (let w = 0; w * 7 < n; w++) R.buckets.push({ label: (w * 7 + 1) + '–' + Math.min(n, w * 7 + 7), ent: 0, sal: 0, ventas: 0, costo: 0, gop: 0 }); }
  const grupo = f => R.buckets[S.finModo === 'anio' ? f.getMonth() : Math.floor((f.getDate() - 1) / 7)];
  S.ventas.forEach(v => {
    const f = new Date(v.fecha); if (f < ini || f >= fin) return;
    const b = grupo(f);
    R.entradas[v.metodo] = (R.entradas[v.metodo] || 0) + v.total; b.ent += v.total;
    v.items.forEach(it => {
      const sub = it.precio * it.cantidad, cu = costoItem(it), l = it.linea || 'otros';
      const pl = R.porLinea[l] = R.porLinea[l] || { v: 0, c: 0 };
      R.ventas += sub; pl.v += sub; b.ventas += sub;
      if (cu == null){ R.sinCostoU += it.cantidad; R.sinCostoV += sub; }
      else { const c = cu * it.cantidad; R.costo += c; pl.c += c; b.costo += c; }
    });
  });
  S.gastos.forEach(g => {
    if (g.fecha < kIni || g.fecha >= kFin) return;
    const b = grupo(fechaDeDia(g.fecha));
    R.gastos.push(g);
    R.salidas[g.medio] = (R.salidas[g.medio] || 0) + g.monto; b.sal += g.monto;
    R.porCatGasto[g.categoria] = (R.porCatGasto[g.categoria] || 0) + g.monto;
    if (esCompra(g.categoria)) R.compras += g.monto; else { R.gastosOp += g.monto; b.gop += g.monto; }
  });
  R.bruta = R.ventas - R.costo;
  R.neta = R.bruta - R.gastosOp;
  R.totEnt = Object.values(R.entradas).reduce((a, b) => a + b, 0);
  R.totSal = Object.values(R.salidas).reduce((a, b) => a + b, 0);
  R.gastos.sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.creado || '').localeCompare(a.creado || ''));
  return R;
}

function renderFin(){
  Object.values(chartsF).forEach(c => c.destroy()); for (const k in chartsF) delete chartsF[k];
  const P = periodoFin(), R = calcularFin();
  $('#finTop').innerHTML = `
    <div class="per"><button class="icon-btn" data-fin="prev" aria-label="Periodo anterior">‹</button><b>${P.titulo}</b><button class="icon-btn" data-fin="next" aria-label="Periodo siguiente">›</button></div>
    <div class="card-h" style="align-items:center;margin-bottom:12px">
      <div class="seg" style="flex:none"><button data-fm="mes" class="${S.finModo === 'mes' ? 'on' : ''}">Mes</button><button data-fm="anio" class="${S.finModo === 'anio' ? 'on' : ''}">Año</button></div>
      <button class="btn sm" data-fin="gasto">+ Registrar gasto</button>
    </div>`;
  const lineasV = ordenarLineas(Object.keys(R.porLinea));
  const catsOp = [...CATEGORIAS_GASTO, ...Object.keys(R.porCatGasto).filter(c => !CATEGORIAS_GASTO.includes(c))].filter(c => !esCompra(c) && R.porCatGasto[c]);
  const medios = [...new Set([...METODOS, ...MEDIOS_GASTO, ...Object.keys(R.entradas), ...Object.keys(R.salidas)])].filter(m => R.entradas[m] || R.salidas[m]);
  const cab = t => `<div class="solo-print"><h2 style="margin:0 0 2px">Frío Intenso · ${t}</h2><p class="sub">Periodo: ${P.titulo} · generado el ${new Date().toLocaleDateString('es-CO')}</p></div>`;
  let html = '';
  if (!R.ventas && !R.gastos.length) html += `<div class="card"><div class="empty" style="padding:14px">No hay ventas ni gastos en ${P.titulo}.</div></div>`;
  html += `
    <div class="kpis">
      <div class="kpi"><div class="l">Ventas</div><div class="v">${fmt(R.ventas)}</div></div>
      <div class="kpi"><div class="l">Utilidad bruta · ${pct(R.bruta, R.ventas)}</div><div class="v">${fmt(R.bruta)}</div></div>
      <div class="kpi"><div class="l">Gastos operacionales</div><div class="v">${fmt(R.gastosOp)}</div></div>
      <div class="kpi"><div class="l">Utilidad neta · ${pct(R.neta, R.ventas)}</div><div class="v ${R.neta < 0 ? 'neg' : 'pos'}">${fmt(R.neta)}</div></div>
    </div>`;
  if (R.sinCostoU) html += `<div class="warn">⚠ ${R.sinCostoU} unidades vendidas (${fmt(R.sinCostoV)}) no tienen costo configurado, así que la utilidad sale más alta de lo real.
    Ponle costo a esos tamaños o presentaciones en <b>Productos</b>.</div>`;

  // Estado de resultados
  html += `<div class="card imprimible" id="finReporte">${cab('Estado de resultados')}
    <h3>Estado de resultados</h3><p class="sub">${P.titulo} · ventas − costos − gastos</p>
    <div class="er">
      <div class="er-row"><span>Ventas</span><span>${fmt(R.ventas)}</span></div>
      ${lineasV.map(l => `<div class="er-row sub"><span>${esc(nombreLinea(l))}</span><span>${fmt(R.porLinea[l].v)}</span></div>`).join('')}
      <div class="er-row"><span>(−) Costo de ventas</span><span>${fmt(R.costo)}</span></div>
      ${lineasV.filter(l => R.porLinea[l].c).map(l => `<div class="er-row sub"><span>${esc(nombreLinea(l))}</span><span>${fmt(R.porLinea[l].c)}</span></div>`).join('')}
      <div class="er-row tot"><span>Utilidad bruta<span class="pct">${pct(R.bruta, R.ventas)}</span></span><span class="${R.bruta < 0 ? 'neg' : ''}">${fmt(R.bruta)}</span></div>
      <div class="er-row"><span>(−) Gastos operacionales</span><span>${fmt(R.gastosOp)}</span></div>
      ${catsOp.map(c => `<div class="er-row sub"><span>${esc(c)}</span><span>${fmt(R.porCatGasto[c])}</span></div>`).join('')}
      <div class="er-row tot"><span>Utilidad neta<span class="pct">${pct(R.neta, R.ventas)}</span></span><span class="${R.neta < 0 ? 'neg' : 'pos'}">${fmt(R.neta)}</span></div>
    </div>
    ${R.compras ? `<p class="sub" style="margin:12px 0 0">Compras de insumos y mercancía: <b>${fmt(R.compras)}</b>. No se restan aquí porque ese valor ya está en el costo de ventas (${fmt(R.costo)}); sí salen en el flujo de caja.</p>` : ''}
    <div class="toolbar no-print" style="margin-top:12px"><button class="btn sm ghost" data-fin="print">Imprimir / guardar PDF</button><button class="btn sm ghost" data-fin="csv">Descargar CSV</button></div>
  </div>`;

  // Flujo de caja
  html += `<div class="card imprimible">${cab('Flujo de caja')}
    <h3>Flujo de caja</h3><p class="sub">Lo que entró (ventas) y salió (gastos y compras), por medio de pago · valores en pesos</p>
    <div class="ft-wrap"><table class="ft"><thead><tr><th>Medio</th><th>Entró</th><th>Salió</th><th>Neto</th></tr></thead><tbody>
      ${medios.map(m => { const n = (R.entradas[m] || 0) - (R.salidas[m] || 0);
        return `<tr><td>${esc(m)}</td><td>${fmtN(R.entradas[m] || 0)}</td><td>${fmtN(R.salidas[m] || 0)}</td><td class="${n < 0 ? 'neg' : ''}">${fmtN(n)}</td></tr>`; }).join('')}
      <tr class="tot"><td>Total</td><td>${fmtN(R.totEnt)}</td><td>${fmtN(R.totSal)}</td><td class="${R.totEnt - R.totSal < 0 ? 'neg' : 'pos'}">${fmtN(R.totEnt - R.totSal)}</td></tr>
    </tbody></table></div>

  // Gastos

  if (cats.length) html += `<div class="card"><h3>Gastos por categoría</h3><p class="sub">${fmt(totG)} en total, incluyendo compras de insumos</p>
    ${filasBarras(cats.map(([c, v]) => ({ titulo: esc(c), v, der: fmt(v) + '<small>' + pct(v, totG) + '</small>' })), Math.max(...cats.map(c => c[1])), 'var(--frap)')}</div>`;
  html += `<div class="sec-h"><b>Gastos de ${P.titulo}</b>${R.gastos.length ? '<button class="btn sm ghost" data-fin="csvg">CSV gastos</button>' : ''}</div>
    ${R.gastos.length ? R.gastos.slice(0, S.verGastos || 15).map(g => { const f = fechaDeDia(g.fecha);
      return `<div class="gasto" ${g.cierreId ? '' : `data-ge="${g.id}" style="cursor:pointer"`}>
        <div class="f"><b>${f.getDate()}</b>${MESES[f.getMonth()].slice(0, 3)}</div>
        <div class="d">${esc(g.descripcion || g.categoria)}<small>${esc(g.categoria)} · ${esc(nombreMedio(g.medio))}${g.cierreId ? ' · en cierre de caja' : ''}</small></div>
        <div class="m">${fmt(g.monto)}</div>
        ${g.cierreId ? `<button class="lock" data-glock="1" aria-label="Gasto en un cierre">${ICON_LOCK}</button>`
          : `<button class="icon-btn del" data-gd="${g.id}" aria-label="Eliminar gasto">${ICON_TRASH}</button>`}
      </div>`; }).join('') + (R.gastos.length > (S.verGastos || 15) ? `<button class="btn ghost block" data-fin="mas">Ver más gastos (${R.gastos.length - (S.verGastos || 15)} restantes)</button>` : '')
      + '<p class="sub" style="text-align:center;margin-top:8px">Toca un gasto para editarlo</p>' : `<div class="empty">No hay gastos registrados en ${P.titulo}.</div>`}`;
  $('#finBody').innerHTML = html;
  dibujarFin(R);
}

function dibujarFin(R){
  if (typeof Chart === 'undefined') return;
  Chart.defaults.font.family = 'Nunito, system-ui, sans-serif';
  const labels = R.buckets.map(b => b.label);
  const o = opcionesBase();
  o.scales.y.ticks.callback = v => fmtK(v);
  o.interaction = { mode: 'index', intersect: false };
  o.plugins.tooltip.displayColors = true;
  o.plugins.tooltip.callbacks = { label: c => c.dataset.label + ': ' + fmt(c.parsed.y) };
  o.plugins.legend = { display: true, position: 'top', align: 'start',
    labels: { color: css('--ink'), usePointStyle: true, pointStyle: 'rectRounded', boxWidth: 10, boxHeight: 10, font: { weight: '800', size: 12 } } };
  chartsF.flujo = new Chart(document.getElementById('cFlujo'), { type: 'bar', data: { labels, datasets: [
    { label: 'Entró', data: R.buckets.map(b => b.ent), backgroundColor: css('--gran'), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 22 },
    { label: 'Salió', data: R.buckets.map(b => b.sal), backgroundColor: css('--frap'), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 22 }
  ] }, options: o });
  const cv = document.getElementById('cUtil');
  if (cv){
    const u = R.buckets.map(b => b.ventas - b.costo - b.gop);
    const o2 = opcionesBase();
    o2.scales.y.beginAtZero = true;
    o2.scales.y.ticks.callback = v => fmtK(Math.abs(v)).replace('$', v < 0 ? '−$' : '$');
    o2.plugins.tooltip.callbacks = { label: c => 'Utilidad neta: ' + fmt(c.parsed.y) };
    chartsF.util = new Chart(cv, { type: 'bar', data: { labels, datasets: [{ data: u, backgroundColor: u.map(v => v < 0 ? css('--danger') : css('--gran')),
      borderRadius: 4, borderSkipped: false, maxBarThickness: 26 }] }, options: o2 });
  }
}

function exportarEstado(){
  const P = periodoFin(), R = calcularFin();

async function borrarGasto(id){

async function cargarDemo(){
  if (S.ventas.length && !await confirmar('Esto reemplaza las ventas actuales por datos de ejemplo. ¿Continuar?', 'Reemplazar')) return;
  const porLinea = {};
  lineasActivas().forEach(L => { const prods = S.productos.filter(p => p.activo && p.linea === L.id && variantesDe(p).length); if (prods.length) porLinea[L.id] = prods; });
  const disponibles = Object.keys(porLinea);
  if (!disponibles.length) return toast('Primero agrega productos con precio');
  const pesoLinea = { granizado: 45, frappe: 25, cerveza: 15, licor: 8, agua: 7 };
  const pesoP = [5, 3.6, 4.2, 2.4, 1.1, 2, 3, 2.5, 1.5, 2];
  const pesoV = (vs, porTam) => porTam ? (vs.length === 3 ? [3, 5, 2] : vs.map(() => 1)) : vs.map((_, i) => [6, 2, 1][i] ?? 1);
  const elegir = (arr, pesos) => { const s = pesos.reduce((a, b) => a + b, 0); let r = Math.random() * s; for (let i = 0; i < arr.length; i++){ r -= pesos[i]; if (r <= 0) return arr[i]; } return arr[0]; };
  const pesoHora = { 10:1, 11:2, 12:4, 13:5, 14:7, 15:8, 16:7, 17:6, 18:4, 19:3, 20:2, 21:1 };
  const horasL = Object.keys(pesoHora).map(Number);
  const ventas = [], ahora = new Date();
  for (let d = 59; d >= 0; d--){
    const dia = new Date(); dia.setDate(dia.getDate() - d);
    const dow = dia.getDay();
    const n = Math.round((dow === 0 || dow === 6 ? 30 : dow === 5 ? 24 : 17) * (0.75 + Math.random() * 0.5));
    for (let i = 0; i < n; i++){
      const f = new Date(dia); f.setHours(elegir(horasL, horasL.map(h => pesoHora[h])), Math.floor(Math.random() * 60), Math.floor(Math.random() * 60), 0);
      if (f > ahora) continue;
      const nItems = Math.random() < .7 ? 1 : Math.random() < .75 ? 2 : 3;
      const mapa = {};
      for (let k = 0; k < nItems; k++){
        const l = elegir(disponibles, disponibles.map(x => pesoLinea[x] ?? 5));
        const prods = porLinea[l];
        const p = elegir(prods, prods.map((_, j) => pesoP[j] ?? 2)), vs = variantesDe(p), t = elegir(vs, pesoV(vs, esPorTamano(l)));
        const key = p.id + '|' + t.id;
        if (!mapa[key]) mapa[key] = { productoId: p.id, nombre: p.nombre, linea: l, tamanoId: t.id, oz: t.oz, variante: t.etiqueta, precio: t.precio, cantidad: 0 };
        mapa[key].cantidad++;
      }
      const items = Object.values(mapa);
      const r = Math.random();
      ventas.push({ id: uid(), fecha: f.toISOString(), metodo: r < .5 ? 'Efectivo' : r < .82 ? 'Nequi' : r < .92 ? 'Daviplata' : 'Transferencia', items, total: items.reduce((a, it) => a + it.precio * it.cantidad, 0) });
    }
  }
  // Cierres de ejemplo: todos los días anteriores quedan cerrados; hoy queda abierto
  S.ventas = ventas; S.cierres = [];
  // Gastos de ejemplo: arriendo, servicios, nómina, insumos semanales y hielo pagado con la caja
  S.gastos = [];
  const G = (fecha, categoria, descripcion, monto, medio) => S.gastos.push({ id: uid(), fecha, creado: new Date().toISOString(), categoria, descripcion, monto, medio });
  for (let d = 59; d >= 0; d--){
    const f = new Date(); f.setDate(f.getDate() - d); const k = keyDia(f), dm = f.getDate();
    if (dm === 1) G(k, 'Arriendo', 'Arriendo del local', 1200000, 'Transferencia');
    if (dm === 5) G(k, 'Servicios públicos', 'Luz y agua', 160000 + Math.round(Math.random() * 40) * 1000, 'Nequi');
    if (dm === 15 || dm === 30) G(k, 'Nómina y pagos a personal', 'Quincena ayudante', 700000, 'Transferencia');
    if (f.getDay() === 1) G(k, 'Insumos y mercancía', 'Fruta, leche, vasos y cerveza', 380000 + Math.round(Math.random() * 120) * 1000, 'Transferencia');
    if (Math.random() < .45) G(k, 'Insumos y mercancía', 'Hielo', 8000 + Math.round(Math.random() * 7) * 1000, 'Efectivo');
    if (Math.random() < .08) G(k, 'Transporte y domicilios', 'Domicilio de insumos', 12000, 'Efectivo');
  }
  const hoyK = keyDia(new Date());
  const dias = [...new Set(ventas.map(v => keyDia(new Date(v.fecha))))].filter(d => d !== hoyK).sort();
  dias.forEach(d => {
    const vs = ventas.filter(v => keyDia(new Date(v.fecha)) === d);
    const ultima = new Date(Math.max(...vs.map(v => +new Date(v.fecha))));
    const cerrado = new Date(ultima); cerrado.setHours(21, 30 + Math.floor(Math.random() * 40), 0, 0);
    const r = resumenVentas(vs), base = 50000;
    const ajuste = Math.random() < .7 ? 0 : (Math.random() < .5 ? -1 : 1) * 1000 * Math.ceil(Math.random() * 6);
    const gs = gastosCajaDe(d), gtot = gs.reduce((a, g) => a + g.monto, 0);
    S.cierres.push(crearCierre(d, vs, r, { base, contado: base + (r.porMetodo.Efectivo || 0) - gtot + ajuste, responsable: 'Ejemplo', nota: '' }, cerrado.toISOString(), gs));
  });
  render();
  if (await guardar(DB.reemplazarVentasYCierres())) toast('Datos de ejemplo cargados');
}

const lineaDeCategoria = c => c === 'Frappé' ? 'frappe' : 'granizado';
const migrarProductos = list => list.map(p => p.linea ? p : { id: p.id, nombre: p.nombre, linea: lineaDeCategoria(p.categoria), color: p.color, activo: p.activo !== false });
const migrarVentas = list => list.map(v => ({ ...v, items: v.items.map(it => it.linea ? it : { ...it, linea: lineaDeCategoria(it.categoria), oz: it.oz ?? null, tamanoId: it.tamanoId ?? null }) }));

/* ================= ARRANQUE E INICIO DE SESIÓN ================= */
let usuario = null, ultimaCarga = 0, sinSesion = false;
const copia = o => JSON.parse(JSON.stringify(o));

async function cargarDatos(){
  let d, desdeCache = false;
  try {
    d = await DB.cargar();
  } catch(e){
    if (!NUBE) throw e;
    console.error(e);
    d = Almacen.get('fi_cache', null);
    if (!d) throw e;
    desdeCache = true;
  }
  const vacio = !d.productos && !d.tamanos && !(d.ventas || []).length;
  // Categorías: si todavía no existen (versión anterior), se crean las de ejemplo y sus productos
  const nuevasLineas = !d.lineas || !d.lineas.length;
  S.lineas = nuevasLineas ? copia(LINEAS_INICIALES) : d.lineas;
  indexarLineas();
  S.productos = d.productos ? migrarProductos(d.productos) : (vacio ? PRODUCTOS_INICIALES.map(p => ({ ...p })) : []);
  S.tamanos = d.tamanos || (vacio ? copia(TAMANOS_INICIALES) : {});
  lineaIds().forEach(l => { if (!Array.isArray(S.tamanos[l])) S.tamanos[l] = []; });
  let extras = [];
  if (nuevasLineas && !(NUBE && (S.faltaActualizar || desdeCache))){
    extras = PRODUCTOS_EXTRA.filter(p => !S.productos.some(x => x.id === p.id || x.linea === p.linea)).map(p => copia(p));
    S.productos.push(...extras);
  }
  S.ventas = migrarVentas(d.ventas || []);
  S.cierres = d.cierres || [];
  S.gastos = d.gastos || [];
  ultimaCarga = Date.now();
  if (!NUBE) return DBLocal._guardar();
  if (!desdeCache) guardarCache(true);
  // Ventas hechas sin internet que todavía no llegan a la nube
  Cola.leer().forEach(v => { if (!S.ventas.some(x => x.id === v.id)) S.ventas.push(v); });
  if (desdeCache) toast('Sin internet: mostrando los últimos datos guardados');
  else {
    // Primera vez en la nube (o primera vez con categorías): guarda lo de ejemplo
    const tareas = [];
    if (vacio){ tareas.push(insertarEnTrozos('productos', S.productos.map(Fila.producto))); tareas.push(insertarEnTrozos('tamanos', filasTamanos(S.tamanos))); }
    else if (extras.length) tareas.push(insertarEnTrozos('productos', extras.map(Fila.producto)));
    if (nuevasLineas && !S.faltaActualizar) tareas.push(insertarEnTrozos('lineas', S.lineas.map(Fila.linea)));
    if (tareas.length) await guardar(Promise.all(tareas));
  }
  pintarEstadoNube();
}
// Copia de los datos en el celular para poder abrir la app sin internet.
// Guarda los últimos 180 días de ventas (suficiente para las estadísticas del día a día).
let tCache = null;
function guardarCache(ya){
  if (!NUBE || !usuario) return;
  clearTimeout(tCache);
  const hacer = () => {
    const desde = new Date(Date.now() - 180 * 864e5).toISOString();
    Almacen.set('fi_cache', { lineas: S.faltaActualizar ? null : S.lineas, productos: S.productos, tamanos: S.tamanos, cierres: S.cierres, gastos: S.gastos, ventas: S.ventas.filter(v => v.fecha >= desde) });
  };
  ya ? hacer() : (tCache = setTimeout(hacer, 1500));
}
async function recargar(){
  if (NUBE && !usuario) return;
  try { await cargarDatos(); } catch(e){ console.error(e); }
  render();
}

  $('#login').classList.add('show');
  $('#lErr').textContent = msg || '';
  if (msg) $('#loginForm').style.display = 'none';
}
async function entrar(){
  $('#login').classList.remove('show');
  try { await cargarDatos(); }
  catch(e){ console.error(e); toast('No se pudieron cargar los datos. Revisa la conexión'); }
  render(); pintarEstadoNube(); vaciarCola();
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#lBtn');
  btn.disabled = true; btn.textContent = 'Entrando…'; $('#lErr').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lPass').value });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error){ $('#lErr').textContent = /invalid/i.test(error.message) ? 'Correo o contraseña incorrectos' : 'No se pudo entrar: ' + error.message; return; }
  usuario = data.user; $('#lPass').value = '';
  Almacen.set('fi_usuario', { email: usuario.email });
  await entrar();
});
// Al volver a abrir la app, trae las ventas registradas desde otros celulares
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && NUBE && usuario && Date.now() - ultimaCarga > 60000 && !$('#sheetBg').classList.contains('show')) recargar();
});

(async function iniciar(){
  if (!NUBE){ await cargarDatos(); render(); return; }
  if (!sb) return mostrarLogin('No se pudo cargar la conexión con la nube. Revisa el internet y vuelve a abrir la app.');
  let sesion = null, error = null;
  try { const r = await sb.auth.getSession(); sesion = r.data && r.data.session; error = r.error; } catch(e){ error = e; }
  if (sesion){
    usuario = sesion.user;
    Almacen.set('fi_usuario', { email: usuario.email });
    return entrar();
  }
  // Sin internet no se puede renovar la sesión: si ya había entrado antes, abre con los datos guardados
  const previo = Almacen.get('fi_usuario', null);
  const sinRed = !navigator.onLine || (error && /fetch|network|retry|failed/i.test((error.name || '') + ' ' + (error.message || '')));
  if (previo && sinRed){
    usuario = previo; sinSesion = true;
    return entrar();
  }
  mostrarLogin();
})();

// Cuando vuelve el internet después de abrir sin conexión, confirma la sesión y sube las ventas
window.addEventListener('online', async () => {
  if (!NUBE || !sinSesion) return;
  try {
    const { data, error } = await sb.auth.getSession();
    if (data && data.session){ sinSesion = false; usuario = data.session.user; await vaciarCola(); recargar(); }
    else if (!error){ toast('La sesión venció. Vuelve a entrar'); mostrarLogin(); }
  } catch(e){}
});

// App instalable que abre sin internet (solo cuando está publicada en https)
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:'){
  navigator.serviceWorker.register('./sw.js').catch(e => console.warn('Service worker:', e));
}
</script>
